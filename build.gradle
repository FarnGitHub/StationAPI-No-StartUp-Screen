plugins {
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version '1.15.+'
    id 'ploceus' version '1.15-SNAPSHOT'
    id 'io.freefair.lombok' version '8.+'
}

version = property("mod_version")
group = property("maven_group")

base {
    archivesName = project.archives_base_name
}

ploceus {
    setIntermediaryGeneration(2)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

loom {
    if (project.hasProperty("accesswidener_name") && project.accesswidener_name.length() > 0) {
        accessWidenerPath = file("src/main/resources/${project.accesswidener_name}.accesswidener")
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://mvn.devos.one/releases' }
    maven { url 'https://maven.wispforest.io' }

    maven {url "https://maven.minecraftforge.net/" }
    maven {url "https://maven.glass-launcher.net/releases" }
    maven {url "https://maven.glass-launcher.net/snapshots" }
    maven {url "https://jitpack.io/" }
    maven {url "https://matthewperiut.github.io/repository/" }
    exclusiveContent {
        forRepository {
            maven {url "https://api.modrinth.com/maven" }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings(ploceus.mappings("net.glasslauncher:biny-ornithe:b1.7.3+build.${project.biny_mappings}:mergedv2"))


    clientExceptions ploceus.raven(project.client_raven_build, 'client')
    serverExceptions ploceus.raven(project.server_raven_build, 'server')
    clientSignatures ploceus.sparrow(project.client_sparrow_build, 'client')
    serverSignatures ploceus.sparrow(project.server_sparrow_build, 'server')
    "clientNests"("net.glasslauncher:biny-nests:${project.client_biny_nests_build}")
    "serverNests"("net.glasslauncher:biny-nests:${project.server_biny_nests_build}")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "org.slf4j:slf4j-api:1.8.0-beta4"
    implementation "org.apache.logging.log4j:log4j-slf4j18-impl:2.17.2"
    implementation "me.carleslc:Simple-Yaml:1.8.4"
    modImplementation "com.periut:starac:${project.starac_version}"

    modImplementation("net.modificationstation:StationAPI:${project.stapi_version}") {
        exclude group: "babric", module: "fabric-loader"
    }
}

configurations.configureEach {
    exclude group: 'org.lwjgl.lwjgl'
}


processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}